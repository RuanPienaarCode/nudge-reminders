# A tag push (no 'v' prefix) triggers this. Why each part is load-bearing:
#   - main.js and styles.css are NOT committed here (they are gitignored build
#     output), so this workflow builds them itself from the tagged source and
#     publishes exactly what it built. There is no committed copy to go stale.
#   - permissions: contents:write creates the release; id-token + attestations
#     mint provenance. Attestations can only be minted inside an Actions run,
#     so a release cut by hand can never be attested afterwards.
#   - "Verify tag matches manifest version": Obsidian matches the release tag
#     to manifest.version EXACTLY. This fails the run before publishing a
#     mismatched tag, so you never ship a release Obsidian cannot find.
#   - attest-build-provenance: lets anyone run
#     `gh attestation verify main.js -R RuanPienaarCode/nudge-reminders`.
#   - gh release create with the three raw assets: manifest.json + main.js +
#     styles.css as individual files, never a zip and never the source archive.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned: this workflow mints provenance with contents:write, so a
      # moving tag is the one thing in it that could change without review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag '$TAG' does not match manifest version '$MANIFEST_VERSION'." >&2
            echo "Obsidian matches releases to the manifest version exactly — no 'v' prefix." >&2
            exit 1
          fi
          # versions.json maps plugin version -> minAppVersion. Obsidian reads
          # it to decide which release an older app may install.
          if ! jq -e --arg v "$MANIFEST_VERSION" 'has($v)' versions.json >/dev/null; then
            echo "versions.json has no entry for '$MANIFEST_VERSION'." >&2
            exit 1
          fi
          if [ "$(jq -r .version package.json)" != "$MANIFEST_VERSION" ]; then
            echo "package.json version does not match manifest.json." >&2
            exit 1
          fi

      # The same steps as a local ./build.sh, in the same order: `npm ci`
      # installs exactly package-lock.json, so the bundle is reproducible.
      - name: Build
        run: |
          npm ci
          npm run build
          node --check main.js

      # The guard suite: iOS hazards, CSS guards, the line-format tests. A
      # release should never be the first place these run.
      - name: Run the guard suite
        run: npm test

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            main.js manifest.json styles.css
